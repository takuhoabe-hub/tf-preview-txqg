<style>

body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
.g{min-height:80vh;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:340px;display:grid;gap:12px}
.t{font-family:"Hiragino Mincho ProN",serif;letter-spacing:.3em;font-size:20px;text-align:center;margin:0 0 6px}
p{margin:0;color:var(--sub);font-size:13px;text-align:center}
input{font-size:16px;padding:12px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:4px}
button{font-size:15px;padding:12px;border:0;background:var(--fg);color:var(--bg);border-radius:4px;letter-spacing:.1em}
.err{color:#c8261d;min-height:1.2em}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.i)},key,b(D.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,quiet){
  try{const html=await open_(pw);try{sessionStorage.setItem(K,pw)}catch(e){}

  catch(e){if(!quiet)document.getElementById("err").textContent="パスワードが違います";}
}

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const encode = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));
const form = document.getElementById("f");
const input = document.getElementById("pw");
const error = document.getElementById("err");
const submit = form.querySelector('button[type="submit"]');
const once = document.getElementById("open-once");
let busy = false;
let pendingHTML = null;
function setBusy(value) { busy = value; submit.disabled = value; }
function forget() { try { sessionStorage.removeItem(K); } catch (_) {} }
function show(html) { document.open(); document.write(html); document.close(); }
async function decrypt(key) {
  const bytes = await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.i)}, key, b(D.c));
  return new TextDecoder().decode(bytes);
}
async function restore() {
  setBusy(true);

    // Remove the plaintext entry used by the previous implementation.
    try { sessionStorage.removeItem("tf_preview_pw"); } catch (_) {}

    try { stored = sessionStorage.getItem(K); } catch (_) { return; }
    if (!stored) return;
    const record = JSON.parse(stored);
    if (record.s !== D.s || typeof record.k !== "string") throw new Error("cache");
    const bytes = b(record.k);
    if (bytes.length !== 32) throw new Error("cache");
    const key = await crypto.subtle.importKey("raw", bytes, {name:"AES-GCM"}, false, ["decrypt"]);
    show(await decrypt(key));
  } catch (_) { forget(); }
  finally { setBusy(false); }
}
async function unlock(pw) {

  setBusy(true); error.textContent = ""; once.hidden = true; pendingHTML = null;
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    pw = ""; input.value = "";
